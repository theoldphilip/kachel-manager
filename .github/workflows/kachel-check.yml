# Kachel Manager: the check of every pull request to main and of main itself (CLAUDE.md, "Branches, Versionen, Prüfung").
# Tessera's own workflows (every ESP32 board's firmware, the Docker image, the WASM preview, the build cache, Home
# Assistant's source) are not part of this fork: Home Assistant builds the add-on from screen_manager/Dockerfile.
name: Kachel check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kachel-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python packages
        run: python -m pip install 'aiohttp>=3.12,<4' PyYAML Pillow fonttools jinja2 noiseprotocol
      - name: Our names (tools/kachel_names.py)
        run: python tools/kachel_names.py --check
      - name: Python tests
        run: python -m unittest discover -s tests
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Editor tests
        working-directory: web
        run: npm ci --no-audit --no-fund && npm test
      - name: Editor build equals the one in Git
        working-directory: web
        run: |
          npm run build
          git -C .. status --porcelain -- screen_manager/app/static
          test -z "$(git -C .. status --porcelain -- screen_manager/app/static)"
