# This app is a fork of Tessera 0.4.98 (MaxGramser/homeassistant_espscreen) for the Kachel screens: Alpine Linux
# and echod on tablets. Real ESP32 screens stay with Tessera, which may run beside it (screen_manager/app/kachel.py).
name: Kachel Manager
version: "0.1.3"
slug: kachel_manager
description: "Pages of tiles for the Kachel screens (Alpine Linux and echod on tablets). Based on Tessera."
url: https://github.com/theoldphilip/kachel-manager
arch: [aarch64, amd64]
startup: application
boot: auto
homeassistant_api: true
# A troubleshooting report (docs/REPORTS.md) reads Home Assistant's own log from the Supervisor (/core/logs): the
# homeassistant role is the lowest that gives it, and takes nothing off the app's security rating.
hassio_api: true
hassio_role: homeassistant
ingress: true
ingress_port: 8099
# No port on the LAN: Tessera's 8098 carries camera images for ESP32 screens, and a Kachel screen fetches its pictures
# from Home Assistant itself (own_pictures in its hello).
# With Home Assistant's Watchdog switch on (the app's Info page; off until someone turns it on) the Supervisor starts
# the app again when it stops unexpectedly, and with this address also when it stops answering: the one address the
# app answers from anywhere (server.py guard, the same as Docker's health check).
watchdog: http://[HOST]:[PORT:8099]/health
panel_icon: mdi:view-grid
panel_title: Kachel
panel_admin: true
options: {}
schema: {}

map:
  - homeassistant_config:rw
# No uart or usb: flashing an ESP32 screen is Tessera's.
# Reproducible compiler/download caches (firmware.py build_env); retain screens.json and user configuration.
backup_exclude:
  - '*/build/'
  - '*/esphome/'
  - '*/idf/'
  - '*/platformio/'
